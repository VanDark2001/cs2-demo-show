# Spring Boot 服务、数据库、上传限制、跨域和监控端点配置。
server.port=${SERVER_PORT:8090}
spring.application.name=csdemo-stat-service
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER:127.0.0.1:8848}
spring.cloud.nacos.discovery.enabled=${NACOS_ENABLED:false}
spring.cloud.nacos.discovery.register-enabled=${NACOS_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/csdemo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USER:csdemo}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,OPTIONS
